<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<link rel="stylesheet" href="css.css">
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="keys">

    <button class="func" data-action="memory clear">MC</button>
    <button class="func" data-action="memory recall">MR</button>
    <button class="func" data-action="memory plus">M+</button>
    <button class="func" data-action="memory minus">M-</button>
    <button class="func" data-action="memory store">MS</button>    

    <button class="func" data-action="clear">AC</button>
    <button class="func" data-action="negate">+/-</button>
    <button class="func" data-action="percent">%</button>
    <button class="op" data-action="divide">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="wide" data-num="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>
</body>
</html>
